global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api-gateway/health
          - http://auth-service:8000/health
          - http://sis-service:8000/health
          - http://lms-service:8000/health
          - http://finance-service:8000/health
          - http://hr-service:8000/health
          - http://library-service:8000/health
          - http://operations-service:8000/health
          - http://notification-service:8000/health
          - http://scheduler-service:8000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
