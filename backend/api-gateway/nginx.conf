# ==========================================================================
# Project Nexus – API Gateway (Docker Swarm)
# Swarm's internal DNS (127.0.0.11) resolves service names to VIP addresses
# ==========================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------------
# Rate Limiting (FYP Table 146 — 100 requests/minute per IP)
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_status 429;

upstream auth_service        { server auth-service:8000; }
upstream sis_service          { server sis-service:8000; }
upstream lms_service          { server lms-service:8000; }
upstream finance_service      { server finance-service:8000; }
upstream attendance_service   { server attendance-service:8000; }
upstream ai_service           { server ai-service:8000; }
upstream chat_service         { server chat-service:8000; }
upstream analytics_service    { server analytics-service:8000; }
upstream hr_service           { server hr-service:8000; }
upstream library_service      { server library-service:8000; }
upstream operations_service   { server operations-service:8000; }
upstream alumni_service       { server alumni-service:8000; }
upstream notification_service { server notification-service:8000; }
upstream scheduler_service    { server scheduler-service:8000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Basic request limits to reduce abuse and oversized payload risks.
    client_max_body_size 20m;

    # Security headers for API responses.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Global proxy defaults ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # --- Service routes (rate-limited per FYP Table 146) ---
    location /api/v1/auth/        { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://auth_service; }
    location /api/v1/sis/         { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://sis_service; }
    location /api/v1/lms/         { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://lms_service; }
    location /api/v1/finance/     { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://finance_service; }
    location /api/v1/attendance/  { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://attendance_service; }
    location /api/v1/ai/          { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://ai_service; }
    location /api/v1/chat/        { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://chat_service; }
    location /api/v1/analytics/   { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://analytics_service; }
    location /api/v1/hr/          { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://hr_service; }
    location /api/v1/library/     { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://library_service; }
    location /api/v1/ops/         { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://operations_service; }
    location /api/v1/alumni/      { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://alumni_service; }
    location /api/v1/notify/      { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://notification_service; }
    location /api/v1/scheduler/   { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://scheduler_service; }

    # --- WebSocket (chat) ---
    location /api/v1/chat/ws {
        proxy_pass http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /api/v1/notify/ws {
        proxy_pass http://notification_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # --- Health check ---
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
