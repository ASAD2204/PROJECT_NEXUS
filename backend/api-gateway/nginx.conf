# ==========================================================================
# Project Nexus – API Gateway (Docker Swarm)
# Swarm's internal DNS (127.0.0.11) resolves service names to VIP addresses
# ==========================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------------
# Rate Limiting — increased for local dev to reduce false 429s
# Default: 100r/m; raised to 600r/m with larger burst to avoid client bursts
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
limit_req_status 429;

upstream auth_service         { zone auth_service 64k;         server auth-service:8000 resolve; }
upstream sis_service          { zone sis_service 64k;          server sis-service:8000 resolve; }
upstream lms_service          { zone lms_service 64k;          server lms-service:8000 resolve; }
upstream finance_service      { zone finance_service 64k;      server finance-service:8000 resolve; }
upstream attendance_service   { zone attendance_service 64k;   server attendance-service:8000 resolve; }
upstream ai_service           { zone ai_service 64k;           server ai-service:8000 resolve; }
upstream chat_service         { zone chat_service 64k;         server chat-service:8000 resolve; }
upstream analytics_service    { zone analytics_service 64k;    server analytics-service:8000 resolve; }
upstream hr_service           { zone hr_service 64k;           server hr-service:8000 resolve; }
upstream library_service      { zone library_service 64k;      server library-service:8000 resolve; }
upstream operations_service   { zone operations_service 64k;   server operations-service:8000 resolve; }
upstream alumni_service       { zone alumni_service 64k;       server alumni-service:8000 resolve; }
upstream notification_service { zone notification_service 64k; server notification-service:8000 resolve; }
upstream scheduler_service    { zone scheduler_service 64k;    server scheduler-service:8000 resolve; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Basic request limits to reduce abuse and oversized payload risks.
    client_max_body_size 50m;

    # Security headers for API responses.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Global proxy defaults ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # --- Service routes (rate-limited per FYP Table 146) ---
    location /api/v1/auth/        { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://auth_service; }
    location /api/v1/sis/         { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://sis_service; }
    location /api/v1/students/ {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/api/v1/students/(.*)$ /api/v1/sis/students/$1 break;
        proxy_pass http://sis_service;
    }
    location /api/v1/lms/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_set_header X-Forwarded-Prefix /api/v1/lms;
        proxy_pass http://lms_service/api/v1/lms/;
    }
    location /api/v1/finance/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_set_header X-Forwarded-Prefix /api/v1/finance;
        proxy_pass http://finance_service/api/v1/finance/;
    }
    location /api/v1/attendance/  { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://attendance_service; }
    location /api/v1/ai/          { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://ai_service; }
    location /api/v1/chat/        { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://chat_service; }
    location /api/v1/analytics/   { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://analytics_service; }
    location /api/v1/hr/          { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://hr_service; }
    location /api/v1/library/     { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://library_service; }
    location /api/v1/ops/         { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://operations_service; }
    location /api/v1/operations/ {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/api/v1/operations/(.*)$ /api/v1/ops/$1 break;
        proxy_pass http://operations_service;
    }
    location /api/v1/alumni/      { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://alumni_service; }
    location /api/v1/notify/      { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://notification_service; }
    location /api/v1/notifications/ {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/api/v1/notifications/(.*)$ /api/v1/notify/notifications/$1 break;
        proxy_pass http://notification_service;
    }
    location /api/v1/scheduler/   { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://scheduler_service; }

    # --- WebSocket (chat) ---
    location /api/v1/chat/ws {
        proxy_pass http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /api/v1/notify/ws {
        proxy_pass http://notification_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # --- Health check ---
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
